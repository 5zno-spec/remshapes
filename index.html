<style>
:root{
  --bg:#bfe6fb; --surface:#ffffff; --surface-2:#e1f3fd;
  --sky1:#3f9fe6; --sky2:#d6f1ff;
  --text:#14232e; --text-2:#38505f; --border:rgba(10,50,80,.25);
  --accent-bg:#e6f1fb; --accent:#185fa5; --accent-border:#85b7eb;
  --ok-bg:#eaf3de; --ok:#3b6d11; --ok-border:#97c459;
  --bad:#a32d2d;
}
*{box-sizing:border-box}
html{background:var(--sky2)}
body{margin:0;min-height:100vh;min-height:100dvh;background:transparent;color:var(--text);-webkit-text-size-adjust:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{display:block;flex:none;width:min(104px,26vw);height:auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sub{color:var(--text);margin:0 0 20px;font-size:15px;text-align:center}
.stats{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--surface-2);border-radius:10px;padding:5px 7px 6px;min-width:0}
.stat .row{display:flex;flex-direction:column;align-items:flex-start;line-height:1.35}
.stat .row>span{font-size:11px;color:var(--text-2);white-space:nowrap}
.stat b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:rgba(10,50,80,.15);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:#3f9fe6;transition:width .4s ease}
#barLeft{background:#5fa832}
#barLeft.low{background:#d9534f}
#barLeft.warn{background:#e8a33d}
#barTime{background:#e8a33d;transition:width 1s linear}
.clock{display:inline-block}
.run .clock{animation:tick 1s steps(2,end) infinite}
@keyframes tick{0%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}100%{transform:rotate(-10deg)}}
#board{display:grid;gap:10px;margin:0 auto;position:relative}
.bubble{position:absolute;z-index:5;transform:translate(-50%,-100%);background:#ffffff;color:#14232e;border:1px solid rgba(10,50,80,.2);border-radius:999px;padding:6px 16px;font-size:16px;white-space:nowrap;pointer-events:none;animation:rise 1.3s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-80%) scale(.8)}15%{opacity:1;transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.card{width:100%;aspect-ratio:5/7;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:clamp(26px,9vw,42px);color:var(--text-2);transition:transform .15s}
.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.card:hover{transform:scale(1.04)}}
.card:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@supports (container-type:inline-size){.card{container-type:inline-size}.card>span{font-size:45cqw;line-height:1}}
.pic{display:block;width:82%;height:auto;pointer-events:none;-webkit-user-select:none;user-select:none}
.pic[hidden]{display:none}
.card.b1{background:#f58a34}
.card.b2{background:#22568f}
.card.b3{background:#905e3c}
.card.b1,.card.b2,.card.b3{color:#fffaf2;text-shadow:0 1px 3px rgba(0,0,0,.35);border-color:rgba(0,0,0,.3);box-shadow:inset 0 0 0 4px rgba(255,246,232,.22)}
.card.open{background:#fff4e0;color:#5a3519;border-color:#b27b52;box-shadow:inset 0 0 0 4px rgba(178,123,82,.3)}
.card.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border);cursor:default;transform:none;box-shadow:inset 0 0 0 4px rgba(59,109,17,.2)}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin-top:20px}
.ibtn{display:flex;align-items:center;justify-content:center;width:56px;height:56px;padding:0;border:0;border-radius:18px;color:#fffaf2;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.ibtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ibtn[hidden]{display:none}
.ibtn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.ibtn.map{background:#22568f}
.ibtn.rst{background:#f58a34}
.ibtn.hm{background:#905e3c}
.ibtn.snd{background:#1f8a8a}
.ibtn.snd .x{display:none}
.ibtn.snd.off .x{display:inline}
.ibtn.snd.off .wv{display:none}
.btn{font:inherit;font-size:15px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.main{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
.btn[hidden]{display:none}
#msg{margin-top:12px;font-size:15px;min-height:26px;color:var(--text-2)}
#msg.ok{color:var(--ok)}
#msg.bad{color:var(--bad)}
.sky{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100vh;height:100dvh;overflow:hidden;pointer-events:none;z-index:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
.sun{position:absolute;top:6%;right:8%;width:90px;height:90px;border-radius:50%;background:#fff3b0;box-shadow:0 0 0 14px rgba(255,243,176,.35),0 0 60px 30px rgba(255,236,140,.55)}
.cloud{position:absolute;left:0;width:120px;height:34px;background:#fff;border-radius:40px;opacity:.92;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;top:-28px;left:16px}
.cloud::after{width:74px;height:74px;top:-38px;right:14px}
.c1{top:14%;--s:1.1;animation-duration:110s;animation-delay:-30s}
.c2{top:30%;--s:.8;animation-duration:85s;animation-delay:-60s;opacity:.8}
.c3{top:52%;--s:1.4;animation-duration:140s;animation-delay:-10s}
.c4{top:70%;--s:.9;animation-duration:100s;animation-delay:-75s;opacity:.85}
.c5{top:84%;--s:1.2;animation-duration:125s;animation-delay:-45s;opacity:.7}
@keyframes drift{from{transform:translateX(-200px) scale(var(--s))}to{transform:translateX(calc(100vw + 200px)) scale(var(--s))}}
.stars{display:none;position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:40px 60px #fff,120px 200px #fff,220px 90px #fff,310px 260px #fff,420px 40px #fff,520px 170px #fff,610px 80px #fff,700px 300px #fff,820px 130px #fff,910px 50px #fff,1010px 220px #fff,1100px 90px #fff,1180px 270px #fff,90px 380px #fff,260px 460px #fff,480px 400px #fff,660px 520px #fff,880px 440px #fff,1060px 500px #fff,150px 600px #fff,360px 640px #fff,760px 680px #fff,980px 640px #fff,1150px 600px #fff}
.home,.levels{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:max(7vh,env(safe-area-inset-top)) 20px 28px;overflow-y:auto;transition:opacity .4s ease,visibility .4s}
.home{z-index:40;justify-content:flex-start}
.levels{z-index:45;padding-top:max(5vh,env(safe-area-inset-top))}
.home.hide,.levels.hide{opacity:0;visibility:hidden;pointer-events:none}
body.home main{visibility:hidden}
.hlogo{display:block;width:min(240px,60vw);height:auto;margin-bottom:10px}
.logo,.hlogo{animation:pulse 2.4s ease-in-out infinite;will-change:transform}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.hbtn{width:min(300px,82vw);border:0;border-radius:18px;padding:14px 18px;font:inherit;font-size:20px;font-weight:500;color:#fffaf2;text-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.hbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px}
.hbtn svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.hbtn svg .dot{fill:currentColor;stroke:none}
.lvnum{position:absolute;top:8px;left:12px;min-width:30px;height:30px;padding:0 8px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:#b8581a;font-size:15px;font-weight:600;line-height:1;text-shadow:none;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.hbtn.play{background:#f58a34}
.hbtn.lv{background:#22568f}
.hbtn.inst{background:#905e3c}
.hbtn[hidden]{display:none}
#homeMsg{max-width:300px;min-height:22px;text-align:center;font-size:14px;color:var(--text)}
.levels h2{margin:0;font-size:22px;font-weight:500}
.lvgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;width:min(360px,92vw)}
.lvb{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:18px;font-weight:500;cursor:pointer;padding:0;touch-action:manipulation}
.lvb.cur{background:#f58a34;color:#fff;border-color:rgba(0,0,0,.2)}
.lvb.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.lvb.locked{background:rgba(255,255,255,.5);color:var(--text-2);cursor:not-allowed}
#lvMsg{min-height:22px;text-align:center;font-size:14px;color:var(--text)}
.splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);transition:opacity .4s ease,visibility .4s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash img{display:block;width:min(260px,64vw);height:auto}
.load{width:min(260px,64vw);height:10px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.load>i{display:block;height:100%;width:100%;border-radius:99px;background:#1f6fd1;transform:scaleX(0);transform-origin:right center;animation:fill 5s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}
.intro.show{opacity:1;visibility:visible}
.veil{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.glass{position:relative;max-width:340px;text-align:center;padding:22px 24px 18px;border-radius:22px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 32px rgba(20,60,100,.25),inset 0 1px 0 rgba(255,255,255,.6);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);color:#102635}
.glass p{margin:0;font-size:18px;line-height:1.8;font-weight:500}
.glass .count{display:block;height:4px;border-radius:99px;background:rgba(255,255,255,.75);margin-top:14px;transform-origin:right center}
.intro.show .count{animation:shrink 5s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.result{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}
.result.show{opacity:1;visibility:visible}
.result .veil{pointer-events:auto}
.rwin{position:relative;width:min(320px,100%);text-align:center;padding:24px 24px 20px;border-radius:22px;background:#fff;box-shadow:0 10px 36px rgba(20,60,100,.28);color:#102635;transform:translateY(14px) scale(.94);transition:transform .35s ease}
.result.show .rwin{transform:none}
.rwin h2{margin:0 0 6px;font-size:28px;line-height:1.4;font-weight:700;color:var(--ok)}
.rwin p{margin:0;font-size:18px;line-height:1.8;font-weight:500}
.rbar{height:10px;border-radius:99px;background:rgba(31,111,209,.15);overflow:hidden;margin-top:16px}
.rbar>i{display:block;height:100%;width:100%;border-radius:99px;background:#1f6fd1;transform:scaleX(0);transform-origin:right center}
.result.show .rbar>i{animation:fill 3s linear forwards}
.confetti{position:absolute;top:50%;left:50%;width:0;height:0;pointer-events:none}
.cf{position:absolute;left:-4px;top:-6px;width:8px;height:12px;border-radius:2px;opacity:0}
.result.show .cf{animation:burst 1.5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{
  0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}
  45%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--r)*.5)) scale(1);opacity:1}
  100%{transform:translate(calc(var(--dx)*1.12),calc(var(--dy) + 200px)) rotate(var(--r)) scale(1);opacity:0}
}
.pwa{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}
.pwa.show{opacity:1;visibility:visible}
.pwa .veil{pointer-events:auto}
.pglass{position:relative;width:min(340px,100%);text-align:center;padding:22px 22px 18px;border-radius:28px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 36px rgba(20,60,100,.28),inset 0 1px 0 rgba(255,255,255,.7);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);color:#102635;transform:translateY(18px) scale(.92);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.pwa.show .pglass{transform:none}
.pglass img{display:block;width:min(150px,44vw);height:auto;margin:0 auto 16px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:22px;padding:10px 18px;font:inherit;font-size:22px;font-weight:600;color:#fff;background:#5fa832;text-shadow:0 1px 3px rgba(0,0,0,.3);box-shadow:0 5px 0 #3f7a1c,0 8px 16px rgba(30,80,10,.25);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #3f7a1c}
.pbtn:focus-visible,.pclose:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pbtn svg{flex:none;width:46px;height:46px;overflow:visible}
.pbtn .arr{animation:hop 1.1s ease-in-out infinite}
.pbtn .sp{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.pbtn .sp2{animation-delay:.8s}
@keyframes hop{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.pclose{position:absolute;top:10px;left:10px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.7);color:#25404f;font:inherit;font-size:18px;line-height:1;cursor:pointer}
#pwaNote{min-height:0;margin:12px 0 0;font-size:14px;line-height:1.7;color:#102635}
#pwaNote:empty{display:none}
@media (prefers-reduced-motion: reduce){
  .result,.rwin{transition:none}
  .pglass{transition:none}
  .pbtn .arr,.pbtn .sp{animation:none}
}
@media (prefers-reduced-motion: reduce){
  .intro.show .count{animation:none}
  .card{transition:none}
  .run .clock{animation:none}
  .logo,.hlogo{animation:none}
  .bar>i{transition:none}
  .cloud{animation:none;transform:scale(var(--s))}
  .c1{left:8%}.c2{left:55%}.c3{left:25%}.c4{left:70%}.c5{left:40%}
}
</style>
</head>

      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="22" fill="#fff" stroke="#3f7a1c" stroke-width="2.5"/>

        <path class="sp" d="M42 5l1.6 3.4L47 10l-3.4 1.6L42 15l-1.6-3.4L37 10l3.4-1.6z" fill="#ffd24a"/>
        <path class="sp sp2" d="M5 30l1.2 2.6L9 34l-2.8 1.2L5 38l-1.2-2.8L1 34l2.8-1.4z" fill="#ffd24a"/>

<main>

<script>
/* صور البطاقات (ملفات WebP في مجلد img) */
var IMGS={seed:'img/seed.webp',faucet:'img/faucet.webp',wateringcan:'img/wateringcan.webp',shower:'img/shower.webp',tree:'img/tree.webp',house:'img/house.webp',rocket:'img/rocket.webp',backpack:'img/backpack.webp',net:'img/net.webp',gift:'img/gift.webp',comb:'img/comb.webp',candle:'img/candle.webp',frog:'img/frog.webp',key:'img/key.webp',fish:'img/fish.webp',brush:'img/brush.webp'};
var ITEMS=[{i:'seed',n:'بذرة'},{i:'faucet',n:'صنبور مياه'},{i:'wateringcan',n:'إبريق ري'},{i:'shower',n:'دشّ الاستحمام'},{i:'tree',n:'شجرة'},{i:'house',n:'بيت'},{i:'rocket',n:'صاروخ'},{i:'backpack',n:'حقيبة مدرسية'},{i:'net',n:'شبكة صيد'},{i:'gift',n:'علبة هدية'},{i:'comb',n:'مشط'},{i:'candle',n:'شمعة'},{i:'frog',n:'ضفدع'},{i:'key',n:'مفتاح'},{i:'fish',n:'سمكة'},{i:'brush',n:'فرشاة رسم'}];
/* تحميل الصور مسبقاً أثناء شاشة البداية حتى تظهر كاملة في أول عرض للبطاقات */
var PRELOAD=[];for(var k in IMGS){var im=new Image();im.src=IMGS[k];PRELOAD.push(im);}
var MAX_LEVEL=60;
var board=document.getElementById('board'),levelEl=document.getElementById('level'),
    leftEl=document.getElementById('left'),timeEl=document.getElementById('time'),msg=document.getElementById('msg'),
    resultEl=document.getElementById('result'),resLevel=document.getElementById('resLevel'),resTime=document.getElementById('resTime'),
    barLevel=document.getElementById('barLevel'),barLeft=document.getElementById('barLeft'),barTime=document.getElementById('barTime'),timeBox=document.getElementById('timeBox');
document.getElementById('splashLogo').src=document.getElementById('logo').src;
document.getElementById('homeLogo').src=document.getElementById('logo').src;
var introPending=true;
var level=1,first=null,lock=false,moves=0,mistakes=0,found=0,pairs=0,limit=Infinity,
    timer=null,seconds=0,run=0,flipDelay=900;

try{var saved=parseInt(localStorage.getItem('memoryLevel'),10);if(saved>=1&&saved<=MAX_LEVEL)level=saved;}catch(e){}
var maxLevel=1;
try{var sm=parseInt(localStorage.getItem('memoryMax'),10);if(sm>=1&&sm<=MAX_LEVEL)maxLevel=sm;}catch(e){}
if(level>maxLevel)maxLevel=level;
var allDone=false;
try{
  var ad=localStorage.getItem('memoryAllDone');
  allDone=ad===String(MAX_LEVEL);
  /* من أنهى المراحل الثلاثين في النسخة السابقة تُفتح له المرحلة 31 */
  if(ad==='1'&&maxLevel<31){maxLevel=31;localStorage.setItem('memoryMax','31');}
}catch(e){}
function saveLevel(){
  if(level>maxLevel)maxLevel=level;
  try{localStorage.setItem('memoryLevel',String(level));localStorage.setItem('memoryMax',String(maxLevel));}catch(e){}
}

/* المراحل 1–30 كما هي، ثم 31–60 بعدد أكبر من البطاقات */
function cardsFor(l){
  if(l>=41)return 24;
  if(l>=31)return 20;
  if(l<=2)return 4;
  if(l===3)return 6;
  if(l===4)return 8;
  if(l<=10)return 12;
  if(l<=14)return 14;
  return 16;
}
function limitFor(l,p){
  if(l<=10)return Infinity;
  if(l>=31)return Math.max(4,Math.round(p*0.9-(l-31)*0.15));
  return Math.max(3,Math.round(p*1.5-(l-11)*0.45));
}
function previewFor(l){
  if(l>=31)return Math.round(2600-(l-31)*(1400/29)); /* 2.6 ث في 31 إلى 1.2 ث في 60 */
  return Math.round(3000-(l-1)*(2200/29));
}
function delayFor(l){return l>=31?450:Math.round(900-(l-1)*(450/29));}
function colsFor(n){return n===4?2:n===6?3:n===14||n===20?5:n===24?6:4;}
/* كلما قلّ عدد البطاقات كبر حجمها (العرض الأقصى للبطاقة بالبكسل) */
function sizeFor(n){return n<=4?170:n<=6?135:n<=8?115:n<=16?92:80;}

/* الأصوات: مولَّدة بـ Web Audio دون ملفات، وتعمل دون إنترنت */
var AC=null,soundOn=true;
try{if(localStorage.getItem('memorySound')==='0')soundOn=false;}catch(e){}
function audioCtx(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C();}catch(e){return null;}}
  if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,t0,dur,type,vol,f2){
  var a=audioCtx();if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,vol){
  var a=audioCtx();if(!a)return;
  var n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();
  s.buffer=buf;g.gain.value=vol;s.connect(g);g.connect(a.destination);s.start();
}
var SFX={
  pop:function(){noise(.14,.45);tone(160,0,.12,'sine',.4,50);},
  tap:function(){tone(700,0,.05,'triangle',.1,520);},
  flip:function(){tone(520,0,.09,'triangle',.18,780);},
  reveal:function(){tone(440,0,.12,'sine',.12);tone(660,.08,.16,'sine',.12);},
  match:function(){tone(660,0,.14,'sine',.22);tone(880,.09,.2,'sine',.22);tone(1175,.18,.3,'sine',.18);},
  wrong:function(){tone(240,0,.26,'sawtooth',.07,140);tone(180,0,.26,'triangle',.14,110);},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.11,.3,'triangle',.2);});},
  final:function(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,i*.14,.34,'triangle',.22);});tone(1568,1,.7,'sine',.18);},
  lose:function(){[392,330,262].forEach(function(f,i){tone(f,i*.18,.3,'triangle',.18,f*.94);});}
};
function sfx(n){if(!soundOn)return;try{SFX[n]();}catch(e){}}
var soundBtn=document.getElementById('soundBtn');
function paintSound(){
  soundBtn.classList.toggle('off',!soundOn);
  soundBtn.setAttribute('aria-pressed',soundOn?'false':'true');
  soundBtn.setAttribute('aria-label',soundOn?'كتم الصوت':'تشغيل الصوت');
  soundBtn.title=soundOn?'كتم الصوت':'تشغيل الصوت';
}
soundBtn.addEventListener('click',function(){
  soundOn=!soundOn;paintSound();
  try{localStorage.setItem('memorySound',soundOn?'1':'0');}catch(e){}
  sfx('tap');
});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');
  if(b&&b!==soundBtn&&!b.classList.contains('card'))sfx('tap');
});
paintSound();

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}timeBox.classList.remove('run');}
function startTimer(){if(timer)return;timeBox.classList.add('run');timer=setInterval(function(){seconds++;timeEl.textContent=fmt(seconds);updateBars();},1000);}
function say(t,cls){msg.textContent=t;msg.className=cls||'';}
function showLeft(){
  leftEl.textContent=limit===Infinity?String(mistakes):mistakes+' / '+limit;
  var r=limit===Infinity?Math.min(mistakes/10,1):mistakes/limit;
  barLeft.className=r>=0.75?'low':(r>=0.5?'warn':'');
  barLeft.style.width=Math.round(r*100)+'%';
}
function updateBars(){
  barLevel.style.width=Math.round(((level-1)+(pairs?found/pairs:0))/MAX_LEVEL*100)+'%';
  var s=seconds%60;
  barTime.style.transition=s===0?'none':'';
  barTime.style.width=Math.round(s/60*100)+'%';
}

function show(c,on){
  var s=c.querySelector('span'),m=c.querySelector('img');
  if(on){c.classList.add('open');s.hidden=true;m.hidden=false;c.setAttribute('aria-label',c.dataset.name);}
  else{c.classList.remove('open');s.hidden=false;m.hidden=true;c.setAttribute('aria-label','بطاقة مقلوبة');}
}

function start(){
  run++;var myRun=run;hideResult();
  stopTimer();seconds=0;first=null;moves=0;mistakes=0;found=0;
  var n=cardsFor(level);pairs=n/2;limit=limitFor(level,pairs);flipDelay=delayFor(level);
  levelEl.textContent=level+' / '+MAX_LEVEL;timeEl.textContent='0:00';showLeft();updateBars();
  say('');
  board.innerHTML='';
  var cols=colsFor(n);
  board.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  board.style.maxWidth=(cols*sizeFor(n))+'px';
  var chosen=shuffle(ITEMS.slice()).slice(0,pairs);
  shuffle(chosen.concat(chosen)).forEach(function(d,idx){
    var b=document.createElement('button');
    b.type='button';b.className='card b'+(((Math.floor(idx/cols)+idx%cols)%3)+1);b.dataset.icon=d.i;b.dataset.name=d.n;
    b.innerHTML='<span aria-hidden="true">؟</span><img class="pic" alt="" draggable="false" hidden>';b.querySelector('img').src=IMGS[d.i];
    b.setAttribute('aria-label','بطاقة مقلوبة');
    b.addEventListener('click',function(){pick(b);});
    board.appendChild(b);
  });
  var cards=board.querySelectorAll('.card');
  lock=true;
  function preview(){
    if(myRun!==run)return;
    for(var k=0;k<cards.length;k++)show(cards[k],true);
    sfx('reveal');
    setTimeout(function(){
      if(myRun!==run)return;
      for(var k=0;k<cards.length;k++)show(cards[k],false);
      lock=false;startTimer();
    },previewFor(level));
  }
  if(introPending){introPending=false;showIntro(preview);}
  else preview();
}

function showSplash(done){
  var s=document.getElementById('splash');
  setTimeout(function(){s.classList.add('hide');done();},5000);
}

function showIntro(done){
  var box=document.getElementById('intro');
  box.classList.add('show');
  setTimeout(function(){
    box.classList.remove('show');
    setTimeout(done,350);
  },5000);
}

function pick(c){
  if(lock||c.classList.contains('open')||c.classList.contains('done'))return;
  startTimer();show(c,true);sfx('flip');
  if(!first){first=c;return;}
  moves++;
  var a=first;first=null;var myRun=run;
  if(a.dataset.icon===c.dataset.icon){
    a.classList.remove('open');c.classList.remove('open');
    a.classList.add('done');c.classList.add('done');
    praise(c);setTimeout(function(){sfx('match');},120);
    found++;updateBars();
    if(found===pairs)win();
  }else{
    mistakes++;showLeft();lock=true;setTimeout(function(){sfx('wrong');},220);
    if(limit!==Infinity&&mistakes>=limit){
      setTimeout(function(){
        if(myRun!==run)return;
        show(a,false);show(c,false);
        stopTimer();sfx('lose');
        say('انتهت الأخطاء المسموحة. أعد المرحلة وحاول مرة أخرى.','bad');
      },flipDelay);
      return;
    }
    setTimeout(function(){
      if(myRun!==run)return;
      show(a,false);show(c,false);lock=false;
    },flipDelay);
  }
}

var WORDS=['أحسنت','رائع','جميل','ممتاز'],lastWord=-1;
function praise(c){
  var k;
  do{k=Math.floor(Math.random()*WORDS.length);}while(k===lastWord);
  lastWord=k;
  var b=document.createElement('div');
  b.className='bubble';b.textContent=WORDS[k];
  b.style.left=(c.offsetLeft+c.offsetWidth/2)+'px';
  b.style.top=(c.offsetTop-4)+'px';
  board.appendChild(b);
  setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},1400);
}

var WIN_MS=3000;
function showResult(){
  resLevel.textContent='أنهيت المرحلة '+level;
  resTime.textContent='في وقت '+fmt(seconds);
  resultEl.classList.add('show');
  sfx('pop');confetti();
}
function hideResult(){resultEl.classList.remove('show');}

/* قصاصات ملوّنة تنفجر من خلف النافذة (لا تظهر عند تفعيل تقليل الحركة) */
var CF_COLORS=['#1f6fd1','#5fa832','#f5b81c','#f58a34','#e0457b','#7a5bd6'];
function confetti(){
  var box=document.getElementById('confetti');box.innerHTML='';
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(var i=0;i<36;i++){
    var p=document.createElement('div'),a=Math.random()*Math.PI*2,d=170+Math.random()*150;
    p.className='cf';
    p.style.setProperty('--dx',Math.round(Math.cos(a)*d)+'px');
    p.style.setProperty('--dy',Math.round(Math.sin(a)*d*.8-40)+'px');
    p.style.setProperty('--r',Math.round((Math.random()*2-1)*720)+'deg');
    p.style.background=CF_COLORS[i%CF_COLORS.length];
    p.style.animationDelay=(Math.random()*.08).toFixed(2)+'s';
    if(i%3===0){p.style.width='9px';p.style.height='9px';p.style.borderRadius='50%';}
    box.appendChild(p);
  }
}

function win(){
  stopTimer();lock=true;
  if(level<MAX_LEVEL){
    setTimeout(function(){sfx('win');},450);
    showResult();               /* قبل زيادة المرحلة ليعرض رقم المرحلة التي انتهت */
    level++;saveLevel();        /* حفظ التقدّم فوراً حتى لو خرج اللاعب قبل انتهاء الانتظار */
    var myRun=run;
    setTimeout(function(){
      if(myRun!==run)return;
      hideResult();
      start();
    },WIN_MS);
  }else{
    setTimeout(function(){sfx('final');},450);
    allDone=true;
    try{localStorage.setItem('memoryAllDone',String(MAX_LEVEL));}catch(e){}
    say('مبروك! أنهيت كل المراحل الستين.','ok');
  }
}

document.getElementById('restart').addEventListener('click',start);

var homeEl=document.getElementById('home'),levelsEl=document.getElementById('levels'),
    homeMsg=document.getElementById('homeMsg'),lvMsg=document.getElementById('lvMsg'),
    installBtn=document.getElementById('installBtn');
var deferredPrompt=null,homeMsgTimer=null;

function showHome(){
  document.body.classList.add('home');
  document.getElementById('playSub').textContent=String(level);document.getElementById('playBtn').setAttribute('aria-label','هيا نلعب، المرحلة '+level);
  levelsEl.classList.add('hide');
  homeEl.classList.remove('hide');
  refreshInstall();
}
function enterGame(n){
  if(n)level=n;
  saveLevel();
  document.body.classList.remove('home');
  homeEl.classList.add('hide');levelsEl.classList.add('hide');
  start();
}
function goHome(){run++;hideResult();stopTimer();lock=true;showHome();}

function buildLevels(){
  var g=document.getElementById('lvGrid');g.innerHTML='';lvMsg.textContent='';
  for(var n=1;n<=MAX_LEVEL;n++){(function(n){
    var b=document.createElement('button');b.type='button';b.className='lvb';
    if(n>maxLevel){b.classList.add('locked');b.textContent='🔒';b.setAttribute('aria-label','المرحلة '+n+' مقفلة');}
    else{
      var fin=n<maxLevel||(allDone&&n===MAX_LEVEL);
      if(n===level&&!(allDone&&n===MAX_LEVEL))b.classList.add('cur');else if(fin)b.classList.add('done');
      b.textContent=String(n);b.setAttribute('aria-label','المرحلة '+n);
    }
    b.addEventListener('click',function(){
      if(n>maxLevel){lvMsg.textContent='أنهِ المرحلة '+maxLevel+' أولاً لتفتح هذه المرحلة.';return;}
      openGame(n);
    });
    g.appendChild(b);
  })(n);}
}
function showLevels(){buildLevels();homeEl.classList.add('hide');levelsEl.classList.remove('hide');}

function isStandalone(){
  return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
}
function refreshInstall(){installBtn.hidden=isStandalone();}
function homeNote(t){
  homeMsg.textContent=t;clearTimeout(homeMsgTimer);
  homeMsgTimer=setTimeout(function(){homeMsg.textContent='';},9000);
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;refreshInstall();});
window.addEventListener('appinstalled',function(){deferredPrompt=null;installBtn.hidden=true;pwaHide();});

/* يشغّل نافذة التثبيت الأصلية، وإن لم تتوفر يعرض الطريقة اليدوية عبر note */
function doInstall(note){
  if(deferredPrompt){
    var ev=deferredPrompt;deferredPrompt=null;
    ev.prompt();
    if(ev.userChoice)ev.userChoice.then(function(r){if(r&&r.outcome==='accepted'){installBtn.hidden=true;pwaHide();}});
    return;
  }
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  note(ios?'في متصفح سفاري اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».':'افتح قائمة المتصفح واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
}
installBtn.addEventListener('click',function(){doInstall(homeNote);});

/* نافذة التثبيت الزجاجية */
var pwa=document.getElementById('pwa'),pwaNote=document.getElementById('pwaNote'),pwaBtn=document.getElementById('pwaBtn');
var PWA_DELAY=1000; /* المدة بعد ظهور الصفحة الرئيسية بالمللي ثانية */
document.getElementById('pwaLogo').src=document.getElementById('logo').src;
function pwaShow(){
  var no=false;try{no=sessionStorage.getItem('pwaNo')==='1';}catch(e){}
  if(no||isStandalone()||!document.body.classList.contains('home'))return;
  pwa.classList.add('show');
  setTimeout(function(){pwaBtn.focus();},400);
}
function pwaHide(){
  if(!pwa.classList.contains('show'))return;
  pwa.classList.remove('show');pwaNote.textContent='';
  try{sessionStorage.setItem('pwaNo','1');}catch(e){}
}
pwaBtn.addEventListener('click',function(){doInstall(function(t){pwaNote.textContent=t;});});
document.getElementById('pwaX').addEventListener('click',pwaHide);
document.getElementById('pwaVeil').addEventListener('click',pwaHide);
document.addEventListener('keydown',function(e){if(e.key==='Escape')pwaHide();});

/* التنقل بين الواجهات (الرئيسية / الخريطة / اللعب) مرتبط بسجل المتصفح،
   فيرجع زر الرجوع في الهاتف أو المتصفح إلى الواجهة التي جئت منها بدل الخروج من التطبيق */
var stack=['home'];
try{history.replaceState({i:0,s:'home'},'');}catch(e){}
function pushScreen(s){
  stack.push(s);
  try{history.pushState({i:stack.length-1,s:s},'');}catch(e){}
}
function renderScreen(s){
  pwaHide();
  if(s==='home')goHome();
  else if(s==='levels')goMap();
  else enterGame();
}
window.addEventListener('popstate',function(e){
  var st=e.state||{};
  var sc=(st.s==='levels'||st.s==='game')?st.s:'home';
  var i=parseInt(st.i,10);
  if(!(i>=0))i=0;
  if(i>stack.length)i=stack.length;
  stack.length=Math.min(stack.length,i+1);
  stack[i]=sc;
  renderScreen(sc);
});
function goMap(){run++;hideResult();stopTimer();lock=true;document.body.classList.add('home');showLevels();}
function openGame(n){
  if(!document.body.classList.contains('home'))return; /* اللعبة مفتوحة بالفعل (ضغط مزدوج) */
  pushScreen('game');enterGame(n);
}
function openMap(){
  if(!levelsEl.classList.contains('hide'))return; /* الخريطة مفتوحة بالفعل (ضغط مزدوج) */
  pushScreen('levels');goMap();
}
function backOne(){if(stack.length>1)history.back();else goHome();}
function toHome(){
  var k=stack.lastIndexOf('home'),top=stack.length-1;
  if(k>=0&&k<top)history.go(k-top);
  else goHome();
}

document.getElementById('playBtn').addEventListener('click',function(){openGame();});
document.getElementById('lvBtn').addEventListener('click',openMap);
document.getElementById('lvBack').addEventListener('click',backOne);
document.getElementById('homeBtn').addEventListener('click',toHome);
document.getElementById('mapBtn').addEventListener('click',openMap);

if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
refreshInstall();
showSplash(function(){showHome();setTimeout(pwaShow,PWA_DELAY);});
</script>
</body>
</html>
