<style>
:root{
  --bg:#bfe6fb; --surface:#ffffff; --surface-2:#e1f3fd;
  --sky1:#3f9fe6; --sky2:#d6f1ff;
  --text:#14232e; --text-2:#38505f; --border:rgba(10,50,80,.25);
  --accent-bg:#e6f1fb; --accent:#185fa5; --accent-border:#85b7eb;
  --ok-bg:#eaf3de; --ok:#3b6d11; --ok-border:#97c459;
  --bad:#a32d2d;
}
*{box-sizing:border-box}
html{background:var(--sky2)}
body{margin:0;min-height:100vh;min-height:100dvh;background:transparent;color:var(--text);-webkit-text-size-adjust:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{display:block;flex:none;width:min(104px,26vw);height:auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sub{color:var(--text);margin:0 0 20px;font-size:15px;text-align:center}
.stats{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--surface-2);border-radius:10px;padding:5px 7px 6px;min-width:0}
.stat .row{display:flex;flex-direction:column;align-items:flex-start;line-height:1.35}
.stat .row>span{font-size:11px;color:var(--text-2);white-space:nowrap}
.stat b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:rgba(10,50,80,.15);overflow:hidden;margin-top:3px}

    barLevel=document.getElementById('barLevel'),barLeft=document.getElementById('barLeft'),barTime=document.getElementById('barTime'),timeBox=document.getElementById('timeBox');
document.getElementById('splashLogo').src=document.getElementById('logo').src;
document.getElementById('homeLogo').src=document.getElementById('logo').src;
var introPending=true;
var level=1,first=null,lock=false,moves=0,mistakes=0,found=0,pairs=0,limit=Infinity,
    timer=null,seconds=0,run=0,flipDelay=900;

try{var saved=parseInt(localStorage.getItem('memoryLevel'),10);if(saved>=1&&saved<=MAX_LEVEL)level=saved;}catch(e){}
var maxLevel=1;
try{var sm=parseInt(localStorage.getItem('memoryMax'),10);if(sm>=1&&sm<=MAX_LEVEL)maxLevel=sm;}catch(e){}
if(level>maxLevel)maxLevel=level;
function saveLevel(){
  if(level>maxLevel)maxLevel=level;
  try{localStorage.setItem('memoryLevel',String(level));localStorage.setItem('memoryMax',String(maxLevel));}catch(e){}
}

function cardsFor(l){
  if(l<=2)return 4;
  if(l===3)return 6;
  if(l===4)return 8;
  if(l<=10)return 12;
  if(l<=14)return 14;
  return 16;
}
function limitFor(l,p){
  if(l<=10)return Infinity;
  return Math.max(3,Math.round(p*1.5-(l-11)*0.45));
}
function previewFor(l){return Math.round(3000-(l-1)*(2200/(MAX_LEVEL-1)));}
function delayFor(l){return Math.round(900-(l-1)*(450/(MAX_LEVEL-1)));}
function colsFor(n){return n===4?2:n===6?3:n===14?5:4;}
/* كلما قلّ عدد البطاقات كبر حجمها (العرض الأقصى للبطاقة بالبكسل) */
function sizeFor(n){return n<=4?170:n<=6?135:n<=8?115:92;}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}timeBox.classList.remove('run');}
function startTimer(){if(timer)return;timeBox.classList.add('run');timer=setInterval(function(){seconds++;timeEl.textContent=fmt(seconds);updateBars();},1000);}
function say(t,cls){msg.textContent=t;msg.className=cls||'';}
function showLeft(){
  leftEl.textContent=limit===Infinity?String(mistakes):mistakes+' / '+limit;
  var r=limit===Infinity?Math.min(mistakes/10,1):mistakes/limit;
  barLeft.className=r>=0.75?'low':(r>=0.5?'warn':'');
  barLeft.style.width=Math.round(r*100)+'%';
}
function updateBars(){
  barLevel.style.width=Math.round(((level-1)+(pairs?found/pairs:0))/MAX_LEVEL*100)+'%';
  var s=seconds%60;
  barTime.style.transition=s===0?'none':'';
  barTime.style.width=Math.round(s/60*100)+'%';
}

function show(c,on){
  var s=c.querySelector('span'),m=c.querySelector('img');
  if(on){c.classList.add('open');s.hidden=true;m.hidden=false;c.setAttribute('aria-label',c.dataset.name);}
  else{c.classList.remove('open');s.hidden=false;m.hidden=true;c.setAttribute('aria-label','بطاقة مقلوبة');}
}

function start(){
  run++;var myRun=run;
  stopTimer();seconds=0;first=null;moves=0;mistakes=0;found=0;
  var n=cardsFor(level);pairs=n/2;limit=limitFor(level,pairs);flipDelay=delayFor(level);
  levelEl.textContent=level+' / '+MAX_LEVEL;timeEl.textContent='0:00';showLeft();updateBars();
  nextBtn.hidden=true;say('');
  board.innerHTML='';
  var cols=colsFor(n);
  board.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  board.style.maxWidth=(cols*sizeFor(n))+'px';
  var chosen=shuffle(ITEMS.slice()).slice(0,pairs);
  shuffle(chosen.concat(chosen)).forEach(function(d,idx){
    var b=document.createElement('button');
    b.type='button';b.className='card b'+(((Math.floor(idx/cols)+idx%cols)%3)+1);b.dataset.icon=d.i;b.dataset.name=d.n;
    b.innerHTML='<span aria-hidden="true">؟</span><img class="pic" alt="" draggable="false" hidden>';b.querySelector('img').src=IMGS[d.i];
    b.setAttribute('aria-label','بطاقة مقلوبة');
    b.addEventListener('click',function(){pick(b);});
    board.appendChild(b);
  });
  var cards=board.querySelectorAll('.card');
  lock=true;
  function preview(){
    if(myRun!==run)return;
    for(var k=0;k<cards.length;k++)show(cards[k],true);
    say('تذكّر أماكن الأشكال…');
    setTimeout(function(){
      if(myRun!==run)return;
      for(var k=0;k<cards.length;k++)show(cards[k],false);
      lock=false;startTimer();
      say(limit===Infinity?'':'مسموح لك بـ '+limit+' أخطاء في هذه المرحلة.');
    },previewFor(level));
  }
  if(introPending){introPending=false;showIntro(preview);}
  else preview();
}

function showSplash(done){
  var s=document.getElementById('splash');
  setTimeout(function(){s.classList.add('hide');done();},5000);
}

function showIntro(done){
  var box=document.getElementById('intro');
  box.classList.add('show');
  setTimeout(function(){
    box.classList.remove('show');
    setTimeout(done,350);
  },5000);
}

function pick(c){
  if(lock||c.classList.contains('open')||c.classList.contains('done'))return;
  startTimer();show(c,true);
  if(!first){first=c;return;}
  moves++;
  var a=first;first=null;var myRun=run;
  if(a.dataset.icon===c.dataset.icon){
    a.classList.remove('open');c.classList.remove('open');
    a.classList.add('done');c.classList.add('done');
    praise(c);
    found++;updateBars();
    if(found===pairs)win();
  }else{
    mistakes++;showLeft();lock=true;
    if(limit!==Infinity&&mistakes>=limit){
      setTimeout(function(){
        if(myRun!==run)return;
        show(a,false);show(c,false);
        stopTimer();
        say('انتهت الأخطاء المسموحة. أعد المرحلة وحاول مرة أخرى.','bad');
      },flipDelay);
      return;
    }
    setTimeout(function(){
      if(myRun!==run)return;
      show(a,false);show(c,false);lock=false;
    },flipDelay);
  }
}

var WORDS=['أحسنت','رائع','جميل','ممتاز'],lastWord=-1;
function praise(c){
  var k;
  do{k=Math.floor(Math.random()*WORDS.length);}while(k===lastWord);
  lastWord=k;
  var b=document.createElement('div');
  b.className='bubble';b.textContent=WORDS[k];
  b.style.left=(c.offsetLeft+c.offsetWidth/2)+'px';
  b.style.top=(c.offsetTop-4)+'px';
  board.appendChild(b);
  setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},1400);
}

function win(){
  stopTimer();lock=true;
  if(level<MAX_LEVEL){
    say('أحسنت! أنهيت المرحلة '+level+' في '+moves+' محاولة وزمن '+fmt(seconds)+'. ننتقل إلى المرحلة التالية…','ok');
    var myRun=run;
    setTimeout(function(){
      if(myRun!==run)return;
      level++;saveLevel();start();
    },1800);
  }else{
    say('مبروك! أنهيت كل المراحل الثلاثين.','ok');
  }
}

nextBtn.addEventListener('click',function(){if(level<MAX_LEVEL){level++;saveLevel();start();}});
document.getElementById('restart').addEventListener('click',start);

var homeEl=document.getElementById('home'),levelsEl=document.getElementById('levels'),
    homeMsg=document.getElementById('homeMsg'),lvMsg=document.getElementById('lvMsg'),
    installBtn=document.getElementById('installBtn');
var deferredPrompt=null,homeMsgTimer=null;

function showHome(){
  document.body.classList.add('home');
  document.getElementById('playSub').textContent=String(level);document.getElementById('playBtn').setAttribute('aria-label','هيا نلعب، المرحلة '+level);
  levelsEl.classList.add('hide');
  homeEl.classList.remove('hide');
  refreshInstall();
}
function enterGame(n){
  if(n)level=n;
  saveLevel();
  document.body.classList.remove('home');
  homeEl.classList.add('hide');levelsEl.classList.add('hide');
  start();
}
function goHome(){run++;stopTimer();lock=true;showHome();}

function buildLevels(){
  var g=document.getElementById('lvGrid');g.innerHTML='';lvMsg.textContent='';
  for(var n=1;n<=MAX_LEVEL;n++){(function(n){
    var b=document.createElement('button');b.type='button';b.className='lvb';
    if(n>maxLevel){b.classList.add('locked');b.textContent='🔒';b.setAttribute('aria-label','المرحلة '+n+' مقفلة');}
    else{
      if(n===level)b.classList.add('cur');else if(n<maxLevel)b.classList.add('done');
      b.textContent=String(n);b.setAttribute('aria-label','المرحلة '+n);
    }
    b.addEventListener('click',function(){
      if(n>maxLevel){lvMsg.textContent='أنهِ المرحلة '+maxLevel+' أولاً لتفتح هذه المرحلة.';return;}
      enterGame(n);
    });
    g.appendChild(b);
  })(n);}
}
function showLevels(){buildLevels();homeEl.classList.add('hide');levelsEl.classList.remove('hide');}

function isStandalone(){
  return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
}
function refreshInstall(){installBtn.hidden=isStandalone();}
function homeNote(t){
  homeMsg.textContent=t;clearTimeout(homeMsgTimer);
  homeMsgTimer=setTimeout(function(){homeMsg.textContent='';},9000);
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;refreshInstall();});
window.addEventListener('appinstalled',function(){deferredPrompt=null;installBtn.hidden=true;pwaHide();});

/* يشغّل نافذة التثبيت الأصلية، وإن لم تتوفر يعرض الطريقة اليدوية عبر note */
function doInstall(note){
  if(deferredPrompt){
    var ev=deferredPrompt;deferredPrompt=null;
    ev.prompt();
    if(ev.userChoice)ev.userChoice.then(function(r){if(r&&r.outcome==='accepted'){installBtn.hidden=true;pwaHide();}});
    return;
  }
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  note(ios?'في متصفح سفاري اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».':'افتح قائمة المتصفح واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
}
installBtn.addEventListener('click',function(){doInstall(homeNote);});

/* نافذة التثبيت الزجاجية */
var pwa=document.getElementById('pwa'),pwaNote=document.getElementById('pwaNote'),pwaBtn=document.getElementById('pwaBtn');
var PWA_DELAY=1000; /* المدة بعد ظهور الصفحة الرئيسية بالمللي ثانية */
document.getElementById('pwaLogo').src=document.getElementById('logo').src;
function pwaShow(){
  var no=false;try{no=sessionStorage.getItem('pwaNo')==='1';}catch(e){}
  if(no||isStandalone()||!document.body.classList.contains('home'))return;
  pwa.classList.add('show');
  setTimeout(function(){pwaBtn.focus();},400);
}
function pwaHide(){
  if(!pwa.classList.contains('show'))return;
  pwa.classList.remove('show');pwaNote.textContent='';
  try{sessionStorage.setItem('pwaNo','1');}catch(e){}
}
pwaBtn.addEventListener('click',function(){doInstall(function(t){pwaNote.textContent=t;});});
document.getElementById('pwaNo').addEventListener('click',pwaHide);
document.getElementById('pwaX').addEventListener('click',pwaHide);
document.getElementById('pwaVeil').addEventListener('click',pwaHide);
document.addEventListener('keydown',function(e){if(e.key==='Escape')pwaHide();});

document.getElementById('playBtn').addEventListener('click',function(){enterGame();});
document.getElementById('lvBtn').addEventListener('click',showLevels);
document.getElementById('lvBack').addEventListener('click',showHome);
document.getElementById('homeBtn').addEventListener('click',goHome);
function goMap(){run++;stopTimer();lock=true;document.body.classList.add('home');showLevels();}
document.getElementById('mapBtn').addEventListener('click',goMap);

if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
refreshInstall();
showSplash(function(){showHome();setTimeout(pwaShow,PWA_DELAY);});
</script>
</body>
</html>
